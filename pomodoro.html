<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-TASK PRO | Fokus Taymer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');
        
        body {
            background-color: #070913;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 50% 50%, rgba(181, 0, 255, 0.1) 0%, transparent 60%);
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .nav-link { position: relative; }
        .nav-link::after {
            content: ''; position: absolute; bottom: -4px; left: 0; width: 0%; height: 2px;
            background: #00f3ff; box-shadow: 0 0 10px #00f3ff; transition: width 0.3s ease;
        }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }

        .timer-circle {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="glass-card sticky top-0 z-50 border-b border-cyan-500/30 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-cyan-500/20 border border-cyan-400 flex items-center justify-center shadow-[0_0_15px_rgba(0,243,255,0.4)]">
                    <i class="fa-solid fa-bolt text-cyan-400 text-xl"></i>
                </div>
                <div>
                    <span class="orbitron text-xl font-black tracking-wider text-white">CYBER<span class="text-cyan-400">TASK</span></span>
                    <span class="block text-[10px] tracking-widest text-cyan-400 uppercase">Pro OS v2.6</span>
                </div>
            </a>

            <div class="flex items-center space-x-6 text-lg font-semibold">
                <a href="index.html" class="nav-link text-slate-300 hover:text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="tasks.html" class="nav-link text-slate-300 hover:text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-list-check"></i> Vazifalar</a>
                <a href="pomodoro.html" class="nav-link active text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-stopwatch"></i> Fokus Taymer</a>
                <a href="game.html" class="nav-link text-slate-300 hover:text-pink-400 flex items-center gap-2"><i class="fa-solid fa-gamepad"></i> Cyber Arena</a>
                <a href="telegram.html" class="nav-link text-slate-300 hover:text-sky-400 flex items-center gap-2"><i class="fa-brands fa-telegram"></i> Telegram Bot</a>
            </div>

            <div class="flex items-center gap-4 bg-slate-900/80 px-4 py-1.5 rounded-full border border-slate-700">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-coins text-yellow-400"></i>
                    <span id="nav-coins" class="orbitron font-bold text-yellow-400">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-6 py-10 flex flex-col items-center justify-center">
        
        <div class="glass-card rounded-3xl p-8 md:p-12 w-full text-center relative overflow-hidden">
            <h1 class="orbitron text-2xl md:text-3xl font-black text-white mb-2">NEURAL <span class="text-cyan-400">POMODORO</span> TAYMER</h1>
            <p class="text-slate-400 mb-6">Vazifani tanlang va chalg'imasdan ishlash rejimini yoqing. Har bir tugatilgan sessiya +50 Coin beradi!</p>

            <!-- Mode Buttons -->
            <div class="flex justify-center gap-3 mb-8">
                <button onclick="setMode(25, 'Fokus Rejimi')" id="btn-25" class="mode-btn bg-cyan-500 text-slate-950 font-bold orbitron px-5 py-2 rounded-xl text-sm transition">25 daqiqa (Fokus)</button>
                <button onclick="setMode(5, 'Qisqa Tanaffus')" id="btn-5" class="mode-btn bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold orbitron px-5 py-2 rounded-xl text-sm transition">5 daqiqa (Dam)</button>
                <button onclick="setMode(15, 'Katta Tanaffus')" id="btn-15" class="mode-btn bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold orbitron px-5 py-2 rounded-xl text-sm transition">15 daqiqa (Super Dam)</button>
            </div>

            <!-- SVG Circular Timer -->
            <div class="relative w-72 h-72 mx-auto mb-8 flex items-center justify-center">
                <svg class="w-full h-full" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="#1e293b" stroke-width="6"></circle>
                    <circle id="progress-ring" class="timer-circle" cx="60" cy="60" r="54" fill="none" stroke="#00f3ff" stroke-width="6" stroke-dasharray="339.292" stroke-dashoffset="0" stroke-linecap="round"></circle>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="mode-label" class="text-xs uppercase tracking-widest text-cyan-400 font-bold mb-1">Fokus Rejimi</span>
                    <div id="timer-display" class="orbitron text-5xl font-black text-white tracking-wider">25:00</div>
                </div>
            </div>

            <!-- Active Task Selector -->
            <div class="max-w-md mx-auto mb-8">
                <label class="block text-xs uppercase tracking-wider text-slate-400 font-bold mb-2">Hozir qaysi vazifa ustida ishlayapsiz?</label>
                <select id="active-task-select" class="w-full bg-slate-900 border border-slate-700 focus:border-cyan-400 rounded-xl px-4 py-3 text-white outline-none">
                    <option value="">-- Vazifani tanlang --</option>
                </select>
            </div>

            <!-- Controls -->
            <div class="flex justify-center gap-4">
                <button onclick="toggleTimer()" id="start-btn" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black orbitron px-8 py-4 rounded-xl shadow-[0_0_20px_rgba(0,243,255,0.4)] transition text-lg">
                    <i class="fa-solid fa-play mr-2"></i> BOSHLASH
                </button>
                <button onclick="resetTimer()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold orbitron px-6 py-4 rounded-xl border border-slate-700 transition">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>

    </main>

    <script>
        let totalSeconds = 25 * 60;
        let remainingSeconds = totalSeconds;
        let timerInterval = null;
        let isRunning = false;
        const circumference = 2 * Math.PI * 54; // 339.292

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function alarmSound() {
            [523, 659, 783, 1046].forEach((freq, idx) => {
                setTimeout(() => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.frequency.value = freq;
                    g.gain.value = 0.1;
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(); o.stop(audioCtx.currentTime + 0.2);
                }, idx * 220);
            });
        }

        function loadUserData() {
            const user = JSON.parse(localStorage.getItem('cyber_user')) || { coins: 0, xp: 0 };
            document.getElementById('nav-coins').innerText = user.coins;

            const tasks = JSON.parse(localStorage.getItem('cyber_tasks')) || [];
            const select = document.getElementById('active-task-select');
            tasks.filter(t => !t.completed).forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.innerText = `🎯 ${t.title}`;
                select.appendChild(opt);
            });
        }

        function updateDisplay() {
            const mins = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
            const secs = String(remainingSeconds % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;

            const offset = circumference - (remainingSeconds / totalSeconds) * circumference;
            document.getElementById('progress-ring').style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            const btn = document.getElementById('start-btn');
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> DAVOM ETTIRISH`;
            } else {
                isRunning = true;
                btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> TO'XTATISH`;
                timerInterval = setInterval(() => {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        alarmSound();
                        let user = JSON.parse(localStorage.getItem('cyber_user')) || { coins: 0, xp: 0 };
                        user.coins += 50;
                        user.xp += 60;
                        localStorage.setItem('cyber_user', JSON.stringify(user));
                        loadUserData();
                        alert("🎉 Fokus sessiyasi yakunlandi! Sizga +50 Coin va +60 XP berildi!");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = totalSeconds;
            document.getElementById('start-btn').innerHTML = `<i class="fa-solid fa-play mr-2"></i> BOSHLASH`;
            updateDisplay();
        }

        function setMode(minutes, label) {
            totalSeconds = minutes * 60;
            document.getElementById('mode-label').innerText = label;
            resetTimer();
        }

        loadUserData();
        updateDisplay();
    </script>
</body>
</html>
